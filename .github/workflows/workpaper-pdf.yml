name: Build Workpaper PDF
on:
  push:
    paths: ["workpaper-pdf/**", ".github/workflows/workpaper-pdf.yml"]
  workflow_dispatch:
permissions:
  contents: write
env:
  PDFIUM_TAG: chromium/8179
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: workpaper-pdf
    steps:
      - uses: actions/checkout@v4

      - name: Get PDFium
        shell: pwsh
        run: |
          $tag = [uri]::EscapeDataString($env:PDFIUM_TAG)
          Invoke-WebRequest "https://github.com/bblanchon/pdfium-binaries/releases/download/$tag/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force third_party\pdfium | Out-Null
          tar -xzf pdfium.tgz -C third_party\pdfium
          $notices = "Workpaper PDF includes PDFium ($env:PDFIUM_TAG).`r`n`r`n" + (Get-Content third_party\pdfium\LICENSE -Raw)
          Get-ChildItem third_party\pdfium\licenses -File | ForEach-Object { $notices += "`r`n`r`n==== $($_.Name) ====`r`n" + (Get-Content $_.FullName -Raw) }
          Set-Content THIRD-PARTY-NOTICES.txt $notices

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Unit tests
        shell: pwsh
        run: |
          build\Release\ops_test.exe tests\sample-60-pages.pdf
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
          build\Release\annots_test.exe tests\sample-60-pages.pdf
          if ($LASTEXITCODE -ne 0) { throw "tickmark tests failed" }
          build\Release\textedit_test.exe tests\sample-60-pages.pdf C:\Windows\Fonts\calibri.ttf
          if ($LASTEXITCODE -ne 0) { throw "text editing tests failed" }
          build\Release\find_test.exe tests\sample-60-pages.pdf
          if ($LASTEXITCODE -ne 0) { throw "search tests failed" }

      - name: Conversion check
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force convtest | Out-Null
          $bmp = New-Object System.Drawing.Bitmap 800, 500
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawString("Bank confirmation screenshot", (New-Object System.Drawing.Font "Arial", 28), [System.Drawing.Brushes]::DarkBlue, 20, 40)
          $bmp.Save("$PWD\convtest\shot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("$PWD\convtest\photo.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $bmp.Save("$PWD\convtest\anim.gif", [System.Drawing.Imaging.ImageFormat]::Gif)
          $lines = @("Workpaper notes") + (1..120 | ForEach-Object { "Line $_ of the notes file" })
          Set-Content convtest\notes.txt $lines
          Start-Process build\Release\WorkpaperPDF.exe -ArgumentList '--combine', "$PWD\convtest\out.pdf", "$PWD\convtest\shot.png", "$PWD\convtest\photo.jpg", "$PWD\convtest\anim.gif", "$PWD\convtest\notes.txt", "$PWD\tests\sample-60-pages.pdf" -Wait
          Get-Content convtest\out.pdf.log
          if (-not (Select-String -Path convtest\out.pdf.log -Pattern '^saved=1$' -Quiet)) { throw "conversion failed" }
          Start-Process build\Release\WorkpaperPDF.exe -ArgumentList '--benchmark', "$PWD\convtest\out.pdf", "$PWD\convtest\check.txt" -Wait
          Get-Content convtest\check.txt
          # 3 images + 3 text pages + 60 PDF pages
          if (-not (Select-String -Path convtest\check.txt -Pattern '^pages=66$' -Quiet)) { throw "wrong page count after conversion" }

      - name: Speed check
        shell: pwsh
        run: |
          Start-Process build\Release\WorkpaperPDF.exe -ArgumentList '--benchmark', "$PWD\tests\sample-60-pages.pdf", "$PWD\speed.txt" -Wait
          Get-Content speed.txt
          if (-not (Select-String -Path speed.txt -Pattern '^pages=60$' -Quiet)) { throw "benchmark failed" }
          "## Speed check (60-page sample)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content speed.txt | ForEach-Object { "- $_" } | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Screenshot check
        shell: pwsh
        run: |
          $p = Start-Process build\Release\WorkpaperPDF.exe -ArgumentList "`"$PWD\tests\sample-60-pages.pdf`"" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "the app closed by itself (exit code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force dist | Out-Null
          $bmp.Save("$PWD\dist\screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\WorkpaperPDF | Out-Null
          Copy-Item build\Release\WorkpaperPDF.exe, build\Release\pdfium.dll, THIRD-PARTY-NOTICES.txt dist\WorkpaperPDF\
          Copy-Item README.md dist\WorkpaperPDF\README.txt
          Compress-Archive -Path dist\WorkpaperPDF\* -DestinationPath dist\WorkpaperPDF-portable.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DSourceDir=..\build\Release" installer\WorkpaperPDF.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: WorkpaperPDF
          path: |
            workpaper-pdf/dist/WorkpaperPDF-Setup.exe
            workpaper-pdf/dist/WorkpaperPDF-portable.zip
            workpaper-pdf/dist/screenshot.png
            workpaper-pdf/speed.txt
            workpaper-pdf/convtest/out.pdf

      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "workpaper-pdf-latest"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $notes = "Latest build of Workpaper PDF from branch $env:GITHUB_REF_NAME ($env:GITHUB_SHA).`n`nSpeed check:`n" + ((Get-Content speed.txt) -join "`n")
          gh release create $tag dist\WorkpaperPDF-Setup.exe dist\WorkpaperPDF-portable.zip dist\screenshot.png speed.txt --title "Workpaper PDF (latest build)" --notes $notes --target $env:GITHUB_SHA --prerelease
