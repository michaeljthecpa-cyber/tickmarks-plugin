name: Probe Acrobat SDK download
on:
  push:
    paths: ['.github/workflows/probe-sdk.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Find SDK download links
        shell: pwsh
        run: |
          $pages = @(
            'https://developer.adobe.com/document-services/docs/overview/legacy-documentation/acrobat/',
            'https://opensource.adobe.com/dc-acrobat-sdk-docs/acrobatsdk/',
            'https://opensource.adobe.com/dc-acrobat-sdk-docs/',
            'https://developer.adobe.com/acrobat/'
          )
          foreach ($p in $pages) {
            try {
              $r = Invoke-WebRequest -Uri $p -UseBasicParsing -TimeoutSec 30
              Write-Host "== $p -> $($r.StatusCode)"
              $r.Links | Where-Object { $_.href -match 'sdk|SDK|\.zip|download' } | Select-Object -ExpandProperty href -Unique | Select-Object -First 40 | ForEach-Object { Write-Host "   $_" }
            } catch { Write-Host "== $p -> ERROR $($_.Exception.Message)" }
          }
      - name: Check Visual Studio
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
